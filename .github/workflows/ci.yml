name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # Plain Python: the tests need neither AppDaemon nor Home Assistant.
      - run: python -m unittest discover tests

  lint:
    name: Black and ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install black ruff
      # Both read their profile from pyproject.toml (120 columns, Python 3.9).
      - run: black --check --diff apps tests
      - run: ruff check apps tests
