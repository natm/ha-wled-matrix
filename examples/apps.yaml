# Example AppDaemon config (apps.yaml). Shows energy values from Home Assistant on a 64x64 WLED matrix.
wled_matrix:
  module: wled_matrix
  class: WledMatrix
  refresh: 1            # seconds between frames (keep below WLED's ~2.5 s realtime timeout)
  matrices:
    - host: 192.168.1.50          # the WLED device
      width: 64
      height: 64
      dwell: 10                   # seconds per screen when there's more than one
      screens: [energy]
      # enabled_entity: input_boolean.kitchen_matrix_dashboard   # optional on/off switch
  screens:
    energy:
      rows:
        - icon: mdi:battery
          icon_thresholds:        # pick the icon by value
            - {above: 90, icon: mdi:battery}
            - {above: 70, icon: mdi:battery-80}
            - {above: 50, icon: mdi:battery-60}
            - {above: 30, icon: mdi:battery-40}
            - {above: 10, icon: mdi:battery-20}
            - {above: 0, icon: mdi:battery-outline}
          entity: sensor.battery_state_of_charge
          format: percent
          thresholds:             # first match from the top wins; below all of them uses `colour`
            - {above: 50, colour: [0, 190, 0]}
            - {above: 25, colour: [230, 150, 0]}
          colour: [230, 0, 0]
        - icon: mdi:power-plug
          entity: sensor.house_load_power
          format: power           # W, or kW from 1000 W
          colour: [255, 150, 0]
        - icon: mdi:transmission-tower
          entity: sensor.grid_power
          format: power
          thresholds:
            - {above: 50, colour: [230, 0, 0]}    # importing
          colour: [0, 110, 255]
